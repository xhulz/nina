<script>
'use strict';
/*
 * The NINA office: the project's pipeline as a floor plan seen from above. `nina pipeline --view` serves this page
 * with the room filled in below, and streams the gate ledger's beats at /events. Every stage has a desk in the room
 * of its phase — design, build, review and the gates, the test lab, release — off one corridor; the orchestrator,
 * NINA, keeps the reception, the owner stands at its counter, and new agents come in from the garden. Everything is
 * drawn here, in pixels, on a small canvas scaled up; nothing is fetched from anywhere else. The view starts close
 * enough to read and follows the work around the floor; dragging, the wheel and the buttons take it over.
 */
const ROOM = /*NINA_ROOM*/null || { project: 'demo', stages: ['planner', 'architect', 'implementer', 'reviewer', 'qa', 'dba', 'integration-tester', 'devops', 'secops'], many: ['architect', 'implementer', 'reviewer'], owner: 'you', replay: false };

// ─── palette and sprites ──────────────────────────────────────────────────────────────────────
const C = {
  ink: '#262331', white: '#ffffff', paper: '#fff8e8', red: '#e43b44', green: '#3ec74d',
  floor: '#dfe3e8', floorLine: '#ccd2d9', floorLight: '#e9ecf0', hall: '#d4d9df', hallLine: '#c3c9d0',
  wallTop: '#f7f6f2', wallFace: '#efe4c3', wallFaceDark: '#e2d5ae', band: '#4e7356', bandDark: '#3b5a43', rail: '#9a7247', base: '#3a4a3f',
  wood: '#d9a066', woodMid: '#b97f45', woodDark: '#7a4f2c', counter: '#e8b878',
  chair: '#3c6bd0', chairDark: '#274a96', seatRed: '#c4473b', seatRedDark: '#8e2f27',
  frame: '#2c2f3c', screen: '#59c1ff', screenOff: '#3a4d66', code: '#d8f3ff', key: '#9aa3ad',
  leaf: '#3e8948', leafDark: '#265c42', leafLight: '#63c74d', leafShine: '#9de64e', pot: '#c76b3c', potDark: '#8e4a2a', potWhite: '#e9e9ee',
  grass: '#69b33a', grassDark: '#4f9030', grassLight: '#8fd14f', trunk: '#6b4a2b', path: '#cfc6b2', pathDark: '#b4aa93', flower: '#f6757a', flowerY: '#ffd34d',
  glass: '#9fdcff', glassShine: '#d8f2ff', metal: '#a3acb7', metalDark: '#6c7480', rack: '#3a3f4b', ledG: '#3ef06a', ledR: '#ff5d5d',
  board: '#fdfdfb', boardEdge: '#9aa3ad', book1: '#e43b44', book2: '#3c6bd0', book3: '#feae34', book4: '#3ec74d', sign: '#22202b', signText: '#ffd34d',
  rug: '#c9d6e8', rugEdge: '#9fb3cf',
};
const SHIRTS = ['#e86a92', '#3c8bd9', '#3ec74d', '#feae34', '#8b6fd6', '#f2763a', '#1fb5a5', '#b0b8c4', '#a3d63a', '#f3a6c4', '#a2445e', '#2a8f56'];
const SKINS = ['#ffd6b3', '#f1c27d', '#e0ac69', '#c68642', '#8d5524'];
const HAIRS = ['#3a2a1a', '#e6a33a', '#24212e', '#a5532c', '#c2c3c7', '#7e2553', '#5f574f', '#d96b2b'];
const CONFETTI = ['#e43b44', '#feae34', '#ffd34d', '#3ec74d', '#3c8bd9', '#e86a92'];

// People are ten pixels wide and fourteen tall, outlined. `o` outline, `h` hair, `s` skin, `e` eyes, `t` shirt,
// `p` trousers, `k` shoes.
const SPRITE = {
  front: ['..oooooo..', '.ohhhhhho.', 'ohhhhhhhho', 'ohssssssho', 'ossessesso', '.osssssso.', '..otttto..', '.otttttto.', 'otttttttto', 'osttttttso', '.otttttto.', '.oppppppo.', '.opp..ppo.', '.okk..kko.'],
  frontA: ['..oooooo..', '.ohhhhhho.', 'ohhhhhhhho', 'ohssssssho', 'ossessesso', '.osssssso.', '..otttto..', '.otttttto.', 'otttttttto', 'osttttttso', '.otttttto.', '.oppppppo.', '.opp..ppo.', '.okk...oo.'],
  frontB: ['..oooooo..', '.ohhhhhho.', 'ohhhhhhhho', 'ohssssssho', 'ossessesso', '.osssssso.', '..otttto..', '.otttttto.', 'otttttttto', 'osttttttso', '.otttttto.', '.oppppppo.', '.opp..ppo.', '..oo..kko.'],
  back: ['..oooooo..', '.ohhhhhho.', 'ohhhhhhhho', 'ohhhhhhhho', 'ohhhhhhhho', '.ohhhhhho.', '..otttto..', '.otttttto.', 'otttttttto', 'osttttttso', '.otttttto.', '.oppppppo.', '.opp..ppo.', '.okk..kko.'],
  backA: ['..oooooo..', '.ohhhhhho.', 'ohhhhhhhho', 'ohhhhhhhho', 'ohhhhhhhho', '.ohhhhhho.', '..otttto..', '.otttttto.', 'otttttttto', 'osttttttso', '.otttttto.', '.oppppppo.', '.opp..ppo.', '.okk...oo.'],
  backB: ['..oooooo..', '.ohhhhhho.', 'ohhhhhhhho', 'ohhhhhhhho', 'ohhhhhhhho', '.ohhhhhho.', '..otttto..', '.otttttto.', 'otttttttto', 'osttttttso', '.otttttto.', '.oppppppo.', '.opp..ppo.', '..oo..kko.'],
  cheer: ['os......so', 'oshhhhhhso', 'ohhhhhhhho', 'ohssssssho', 'ossessesso', '.osssssso.', '..otttto..', '.otttttto.', '.otttttto.', '.otttttto.', '.otttttto.', '.oppppppo.', '.opp..ppo.', 'okko..okko'],
  sitA: ['..oooooo..', '.ohhhhhho.', 'ohhhhhhhho', 'ohhhhhhhho', 'ohhhhhhhho', '.ohhhhhho.', '.sotttto..', 'sotttttto.', 'otttttttto', 'otttttttto', '.otttttto.'],
  sitB: ['..oooooo..', '.ohhhhhho.', 'ohhhhhhhho', 'ohhhhhhhho', 'ohhhhhhhho', '.ohhhhhho.', '..ottttos.', '.ottttttos', 'otttttttto', 'otttttttto', '.otttttto.'],
};
const BUBBLE = {
  ask: ['.ooooooo.', 'owwwwwwwo', 'owwkkkwwo', 'owwwwkwwo', 'owwwkkwwo', 'owwwkwwwo', 'owwwwwwwo', 'owwwkwwwo', '.oowwwoo.', '...owo...', '....o....'],
  alarm: ['.ooooooo.', 'owwwwwwwo', 'owwwrwwwo', 'owwwrwwwo', 'owwwrwwwo', 'owwwrwwwo', 'owwwwwwwo', 'owwwrwwwo', '.oowwwoo.', '...owo...', '....o....'],
  pass: ['.ooooooo.', 'owwwwwwwo', 'owwwwwgwo', 'owwwwggwo', 'owgwggwwo', 'owggwwwwo', 'owwgwwwwo', 'owwwwwwwo', '.oowwwoo.', '...owo...', '....o....'],
  back: ['.ooooooo.', 'owwwwwwwo', 'owrwwwrwo', 'owwrwrwwo', 'owwwrwwwo', 'owwrwrwwo', 'owrwwwrwo', 'owwwwwwwo', '.oowwwoo.', '...owo...', '....o....'],
  mail: ['ooooooooo', 'okwwwwwko', 'owkwwwkwo', 'owwkwkwwo', 'owwwkwwwo', 'owwwwwwwo', 'ooooooooo', '.........', '.........', '.........', '.........'],
  talk: ['.ooooooo.', 'owwwwwwwo', 'owwwwwwwo', 'owkwkwkwo', 'owwwwwwwo', '.ooowwwoo', '...owoo..', '...oo....', '.........', '.........', '.........'],
  phone: ['..ooooo..', '.orrrrro.', 'orrooorro', 'oro...oro', '..orrro..', '.orrrrro.', '.orwrwro.', '.orrrrro.', '..ooooo..', '.........', '.........'],
};
const BUBBLE_COLORS = { o: C.ink, w: C.white, k: C.ink, r: C.red, g: C.green };
const GLYPH = {
  N: ['x..x', 'xx.x', 'x.xx', 'x..x', 'x..x'],
  I: ['xxx', '.x.', '.x.', '.x.', 'xxx'],
  A: ['.xx.', 'x..x', 'xxxx', 'x..x', 'x..x'],
};

/** A small stable number from a string, for an agent's looks. */
function hash(text) {
  let h = 2166136261;
  for (const ch of String(text)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return h >>> 0;
}

function paint(ctx, rows, x, y, colors, flip = false) {
  rows.forEach((row, dy) => {
    for (let dx = 0; dx < row.length; dx += 1) {
      const ch = row[flip ? row.length - 1 - dx : dx];
      const color = colors[ch];
      if (ch !== '.' && color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x) + dx, Math.round(y) + dy, 1, 1);
      }
    }
  });
}
const rect = (ctx, x, y, w, h, color) => {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
};
/** A filled box with a one-pixel outline, the way every piece of furniture here is drawn. */
function box(ctx, x, y, w, h, fill, line = C.ink) {
  rect(ctx, x, y, w, h, line);
  rect(ctx, x + 1, y + 1, w - 2, h - 2, fill);
}
function disc(ctx, cx, cy, r, color) {
  for (let y = -r; y <= r; y += 1) for (let x = -r; x <= r; x += 1) if (x * x + y * y <= r * r + r * 0.6) rect(ctx, cx + x, cy + y, 1, 1, color);
}

// ─── the floor plan ───────────────────────────────────────────────────────────────────────────
const LW = 480;
const CORRIDOR_X = 224;
const CORRIDOR_W = 32;
const HALL_X = CORRIDOR_X + CORRIDOR_W / 2;
const FACE = 24;
const DESK_STEP = 52;
const DESK_ROW = 46;
const GARDEN = 52;

/** The rooms, by phase, in the order the work moves through them. A stage not named here works in build. */
const PHASES = [
  { key: 'design', name: 'design', side: 'left', roles: ['planner', 'architect'] },
  { key: 'build', name: 'build', side: 'left', roles: ['implementer', 'solidity-dev'] },
  { key: 'review', name: 'review & gates', side: 'right', roles: ['reviewer', 'dba', 'integration-tester', 'solidity-auditor'] },
  { key: 'lab', name: 'test lab', side: 'right', roles: ['qa'] },
  { key: 'release', name: 'release', side: 'right', roles: ['devops', 'secops'] },
];

const rooms = new Map(PHASES.map((ph) => [ph.key, { ...ph, stages: [] }]));
ROOM.stages.forEach((role, i) => {
  const phase = PHASES.find((ph) => ph.roles.includes(role))?.key ?? 'build';
  rooms.get(phase).stages.push({ role, index: i, seats: ROOM.many.includes(role) ? 2 : 1 });
});
const lobby = { key: 'lobby', name: 'reception', side: 'left', stages: [] };
const columns = {
  left: [rooms.get('design'), rooms.get('build'), lobby],
  right: [rooms.get('review'), rooms.get('lab'), rooms.get('release')],
};
for (const room of [...rooms.values(), lobby]) {
  const desks = room.stages.reduce((n, st) => n + st.seats, 0);
  room.deskCount = desks;
  room.rows = Math.max(1, Math.ceil(desks / 4));
  room.h = room === lobby ? 116 : FACE + 8 + room.rows * DESK_ROW + 26;
}
for (const [side, list] of Object.entries(columns)) {
  let y = 0;
  for (const room of list) {
    room.x = side === 'left' ? 0 : CORRIDOR_X + CORRIDOR_W;
    room.w = side === 'left' ? CORRIDOR_X : LW - room.x;
    room.y = y;
    y += room.h;
  }
}
// The shorter column's last room takes up the difference, so both reach the garden wall together.
const FLOOR_H = Math.max(...Object.values(columns).map((list) => list.at(-1).y + list.at(-1).h));
for (const list of Object.values(columns)) list.at(-1).h = FLOOR_H - list.at(-1).y;
const LH = FLOOR_H + GARDEN;
for (const room of [...rooms.values(), lobby]) {
  room.laneY = room.y + room.h - 14;
  room.doorX = room.side === 'left' ? room.x + room.w : room.x;
}

/** Each stage's desks and the places to stand by them; and the stage of a role. */
const stages = new Map();
for (const room of rooms.values()) {
  let n = 0;
  for (const st of room.stages) {
    const stage = { role: st.role, room, shirt: SHIRTS[st.index % SHIRTS.length], desks: [], slots: [], folder: null };
    for (let k = 0; k < st.seats; k += 1, n += 1) {
      const dx = room.x + 12 + (n % 4) * DESK_STEP;
      const dy = room.y + FACE + 6 + Math.floor(n / 4) * DESK_ROW;
      const aisle = dx + 44;
      const seatY = dy + 34;
      const exit = [{ x: aisle, y: seatY }, { x: aisle, y: room.laneY }];
      stage.desks.push({ dx, dy });
      stage.slots.push({ x: dx + 18, y: seatY, room, exit, kind: 'seat', who: null, desk: stage.desks.at(-1) });
    }
    const first = stage.desks[0];
    stage.drop = { x: first.dx + 44, y: first.dy + 30, room, exit: [{ x: first.dx + 44, y: room.laneY }] };
    stage.spare = { x: first.dx + 44, y: first.dy + 40, room, exit: [{ x: first.dx + 44, y: room.laneY }], kind: 'stand' };
    stages.set(st.role, stage);
  }
}
const COUNTER = { x: lobby.x + 14, y: lobby.y + FACE + 22, w: 104 };
const BOSS_HOME = { x: COUNTER.x + 52, y: COUNTER.y + 2, room: lobby, exit: [{ x: COUNTER.x + COUNTER.w + 10, y: COUNTER.y + 2 }, { x: COUNTER.x + COUNTER.w + 10, y: lobby.laneY }], kind: 'boss' };
const OWNER_HOME = { x: COUNTER.x + 30, y: COUNTER.y + 30, room: lobby, exit: [{ x: COUNTER.x + 30, y: lobby.laneY }], kind: 'stand' };
const ENTRANCE = { x: lobby.x + 150, y: FLOOR_H - 2, room: lobby, exit: [{ x: lobby.x + 150, y: lobby.laneY }], kind: 'stand' };

/** The way from where someone stands to a spot: out to their room's lane, along the corridor when it is another room. */
function route(from, to) {
  const out = from.exit ?? [{ x: from.x, y: from.room.laneY }];
  const into = [...(to.exit ?? [{ x: to.x, y: to.room.laneY }])].reverse();
  const pts = [...out];
  if (from.room !== to.room) {
    pts.push({ x: from.room.doorX, y: from.room.laneY }, { x: HALL_X, y: from.room.laneY }, { x: HALL_X, y: to.room.laneY }, { x: to.room.doorX, y: to.room.laneY });
  }
  pts.push(...into, { x: to.x, y: to.y });
  return pts.filter((p, i) => i === 0 || p.x !== pts[i - 1].x || p.y !== pts[i - 1].y);
}

// ─── the building, drawn once ─────────────────────────────────────────────────────────────────
function tiles(g, x, y, w, h, fill, line) {
  rect(g, x, y, w, h, fill);
  for (let gx = Math.ceil(x / 16) * 16; gx < x + w; gx += 16) rect(g, gx, y, 1, h, line);
  for (let gy = Math.ceil(y / 16) * 16; gy < y + h; gy += 16) rect(g, x, gy, w, 1, line);
}
function plant(g, x, y, big) {
  if (big) {
    box(g, x + 2, y + 12, 10, 8, C.pot);
    rect(g, x + 3, y + 13, 8, 1, '#e08a58');
    disc(g, x + 7, y + 7, 6, C.leafDark);
    disc(g, x + 6, y + 6, 5, C.leaf);
    disc(g, x + 5, y + 4, 2, C.leafLight);
    rect(g, x + 4, y + 3, 1, 1, C.leafShine);
    rect(g, x + 9, y + 7, 1, 1, C.leafShine);
  } else {
    box(g, x + 1, y + 6, 7, 6, C.potWhite);
    disc(g, x + 4, y + 4, 3, C.leaf);
    rect(g, x + 3, y + 2, 1, 1, C.leafShine);
  }
}
function tree(g, x, y) {
  rect(g, x + 7, y + 16, 4, 8, C.trunk);
  rect(g, x + 2, y + 23, 14, 2, 'rgba(0,0,0,0.18)');
  disc(g, x + 9, y + 10, 9, C.leafDark);
  disc(g, x + 8, y + 9, 8, C.leaf);
  disc(g, x + 6, y + 6, 4, C.leafLight);
  for (const [a, b] of [[4, 5], [10, 4], [7, 11], [12, 9]]) rect(g, x + a, y + b, 1, 1, C.leafShine);
}
function deskAt(g, dx, dy) {
  box(g, dx + 11, dy, 14, 10, C.frame);
  rect(g, dx + 16, dy + 10, 4, 1, C.frame);
  box(g, dx, dy + 9, 36, 10, C.wood);
  rect(g, dx + 1, dy + 10, 34, 1, '#ebc08e');
  box(g, dx, dy + 18, 36, 7, C.woodMid);
  rect(g, dx + 1, dy + 24, 34, 1, C.woodDark);
  rect(g, dx + 13, dy + 13, 10, 2, C.key);
  rect(g, dx + 29, dy + 12, 3, 3, C.white);
  box(g, dx + 13, dy + 27, 10, 8, C.chair);
  rect(g, dx + 14, dy + 28, 8, 2, '#5b8be3');
}
function windowAt(g, x, y, w) {
  box(g, x, y, w, 14, C.wallTop);
  rect(g, x + 2, y + 2, w - 4, 10, C.glass);
  rect(g, x + Math.floor(w / 2), y + 2, 1, 10, C.wallTop);
  rect(g, x + 3, y + 3, 3, 1, C.glassShine);
  rect(g, x + Math.floor(w / 2) + 2, y + 3, 3, 1, C.glassShine);
}
function shelf(g, x, y) {
  box(g, x, y, 22, 26, C.woodMid);
  for (let r = 0; r < 3; r += 1) {
    rect(g, x + 1, y + 8 + r * 8, 20, 1, C.woodDark);
    [C.book1, C.book2, C.book3, C.book4, C.book2].forEach((c, i) => rect(g, x + 2 + i * 4, y + 2 + r * 8, 3, 6, c));
  }
}
function wallItem(g, room, kind, x) {
  const y = room.y + 3;
  if (kind === 'window') windowAt(g, x, y, 30);
  else if (kind === 'board') {
    box(g, x, y, 34, 15, C.board, C.boardEdge);
    rect(g, x + 4, y + 4, 12, 1, C.book2);
    rect(g, x + 4, y + 7, 18, 1, C.book1);
    rect(g, x + 20, y + 4, 8, 6, C.book3);
  } else if (kind === 'clock') {
    disc(g, x + 5, y + 7, 5, C.ink);
    disc(g, x + 5, y + 7, 4, C.board);
  } else if (kind === 'poster') {
    box(g, x, y + 1, 12, 15, '#7fc8f8');
    rect(g, x + 3, y + 5, 6, 6, C.white);
  }
}
function sign(g, x, y, w) {
  box(g, x, y, w, 9, C.sign, C.ink);
}
/** How wide a room's name plate is, so what hangs beside it starts after it. */
const signWidth = (room) => Math.max(40, room.name.length * 4 + 8);
/** Where a room's clock, board or poster hangs: towards the far end of its wall. */
const wallSpot = (room) => room.x + room.w - 70;

const background = document.createElement('canvas');
background.width = LW;
background.height = LH;
{
  const g = background.getContext('2d');
  // The garden, and the path to the door.
  rect(g, 0, FLOOR_H, LW, GARDEN, C.grass);
  for (let i = 0; i < 260; i += 1) {
    const hx = hash(`tuft${i}`);
    rect(g, hx % LW, FLOOR_H + 4 + ((hx >> 9) % (GARDEN - 6)), 1, 2, i % 3 ? C.grassDark : C.grassLight);
  }
  rect(g, ENTRANCE.x - 10, FLOOR_H, 20, GARDEN, C.path);
  for (let y = FLOOR_H + 4; y < LH; y += 8) rect(g, ENTRANCE.x - 10, y, 20, 1, C.pathDark);
  for (const tx of [6, 60, 112, 200, 268, 330, 392, 446]) if (Math.abs(tx + 9 - ENTRANCE.x) > 24) tree(g, tx, FLOOR_H + 14);
  for (const fx of [34, 92, 236, 300, 362, 424]) if (Math.abs(fx - ENTRANCE.x) > 20) {
    rect(g, fx, FLOOR_H + 6, 2, 2, C.flower);
    rect(g, fx + 5, FLOOR_H + 9, 2, 2, C.flowerY);
  }
  // The corridor, its floor running the building's height.
  tiles(g, CORRIDOR_X, 0, CORRIDOR_W, FLOOR_H, C.hall, C.hallLine);
  rect(g, CORRIDOR_X, 0, CORRIDOR_W, FACE, C.wallFace);
  rect(g, CORRIDOR_X, FACE - 10, CORRIDOR_W, 8, C.band);
  rect(g, CORRIDOR_X, FACE - 2, CORRIDOR_W, 2, C.base);
  box(g, CORRIDOR_X + 9, 4, 14, 9, '#3ec74d');
  rect(g, CORRIDOR_X + 11, 7, 10, 3, C.white);
  plant(g, CORRIDOR_X + 9, FACE + 2, true);
  plant(g, CORRIDOR_X + 9, FLOOR_H - 26, true);
  // Each room: its floor, the wall it faces, its furniture.
  for (const room of [...rooms.values(), lobby]) {
    tiles(g, room.x, room.y, room.w, room.h, C.floor, C.floorLine);
    rect(g, room.x, room.y, room.w, FACE, C.wallFace);
    rect(g, room.x, room.y + FACE - 11, room.w, 1, C.rail);
    rect(g, room.x, room.y + FACE - 10, room.w, 8, C.band);
    rect(g, room.x, room.y + FACE - 10, room.w, 1, C.bandDark);
    rect(g, room.x, room.y + FACE - 2, room.w, 2, C.base);
    if (room !== lobby) sign(g, room.x + 8, room.y + 4, signWidth(room));
  }
  for (const room of rooms.values()) {
    const far = room.side === 'left' ? room.x + 6 : room.x + room.w - 22;
    wallItem(g, room, 'window', room.x + 8 + signWidth(room) + 16);
    wallItem(g, room, room.key === 'design' ? 'board' : room.key === 'lab' ? 'poster' : 'clock', wallSpot(room));
    for (const st of room.stages) for (const d of stages.get(st.role).desks) deskAt(g, d.dx, d.dy);
    if (room.stages.length === 0) {
      // A room with no stage of its own is somewhere to sit.
      rect(g, room.x + 40, room.y + FACE + 14, room.w - 80, 28, C.rug);
      box(g, room.x + 70, room.y + FACE + 20, room.w - 140, 14, C.wood);
      for (let i = 0; i < 4; i += 1) box(g, room.x + 58 + i * 30, room.y + FACE + 8, 10, 9, C.seatRed);
    }
    plant(g, far, room.laneY - 18, true);
    if (room.key === 'design') shelf(g, room.x + room.w - 30, room.y + FACE + 2);
    if (room.key === 'lab') {

      for (let i = 0; i < 6; i += 1) rect(g, room.x + room.w - 21, room.y + FACE + 5 + i * 4, 2, 1, i % 3 ? C.ledG : C.ledR);
    }
  }
  // The reception: the counter's back, the waiting chairs, a vending machine, plants; the sign on its wall.
  {
    const signW = [...'NINA'].reduce((w, ch) => w + GLYPH[ch][0].length * 2 + 2, -2);

    for (let i = 0; i < 3; i += 1) {

    }

    rect(g, lobby.x + 189, lobby.y + FACE - 3, 12, 14, C.glass);
    for (let i = 0; i < 3; i += 1) rect(g, lobby.x + 190 + i * 4, lobby.y + FACE - 1, 2, 2, [C.red, C.flowerY, C.green][i]);
    rect(g, lobby.x + 140, lobby.y + FACE + 22, 40, 16, C.rug);
    box(g, lobby.x + 150, lobby.y + FACE + 26, 20, 8, C.wood);
    plant(g, COUNTER.x - 12, COUNTER.y - 4, false);

    rect(g, ENTRANCE.x - 12, FLOOR_H - 8, 24, 6, C.rugEdge);
  }

  const wallV = (x, y0, y1) => {

// ─── the people ───────────────────────────────────────────────────────────────────────────────
const SPEED = 75;
const people = new Map();
let placeholders = 0;

function person(key, role, look) {
  const h = hash(look ?? key);
  return {
    key, agent: null, role, x: ENTRANCE.x, y: ENTRANCE.y, at: ENTRANCE, slot: null, queue: [], current: null, path: [],
    pose: 'stand', facing: 'down', typing: false, bubble: null, carrying: null, cheerUntil: 0, leaving: false, born: performance.now(),
    colors: { o: C.ink, h: HAIRS[h % HAIRS.length], s: SKINS[(h >> 3) % SKINS.length], e: C.ink, t: stages.get(role)?.shirt ?? SHIRTS[h % SHIRTS.length], p: '#3a3f58', k: '#22202b' },
  };
}
// The orchestrator is NINA: the session that follows the router and hands the work on.
const boss = person('orchestrator', null, 'orchestrator-boss');
Object.assign(boss, { x: BOSS_HOME.x, y: BOSS_HOME.y, at: BOSS_HOME, pose: 'boss', home: BOSS_HOME });
boss.colors.t = '#2f4a8a';
const owner = person('owner', null, ROOM.owner);
Object.assign(owner, { x: OWNER_HOME.x, y: OWNER_HOME.y, at: OWNER_HOME, facing: 'up', home: OWNER_HOME });
owner.colors.t = '#ffd34d';

const walk = (p, to, then) => p.queue.push({ kind: 'walk', to, then });
const wait = (p, ms) => p.queue.push({ kind: 'wait', ms });
const act = (p, fn) => p.queue.push({ kind: 'do', fn });
const homeOf = (p) => (p === boss ? BOSS_HOME : p === owner ? OWNER_HOME : p.slot);

function say(p, kind, ms) {
  p.bubble = { kind, until: ms ? performance.now() + ms : Infinity };
}
function hush(p, kinds) {
  if (p.bubble && (!kinds || kinds.includes(p.bubble.kind))) p.bubble = null;
}

/** A free desk of a stage for someone, sending its longest-idle occupant away when every desk is taken. */
function seatAt(stage, p) {
  const mine = stage.slots.find((sl) => sl.who === p);
  if (mine) return mine;
  let slot = stage.slots.find((sl) => !sl.who);
  if (!slot) {
    const idle = stage.slots.filter((sl) => sl.who && !sl.who.typing && !sl.who.current && sl.who.queue.length === 0).sort((a, b) => a.who.born - b.who.born)[0];
    if (idle) {
      leave(idle.who);
      slot = idle;
    }
  }
  if (!slot) {
    const extra = { ...stage.spare, who: p, extra: true };
    if (p.slot && p.slot.who === p) p.slot.who = null;
    p.slot = extra;
    return extra;
  }
  if (p.slot && p.slot.who === p) p.slot.who = null;
  slot.who = p;
  p.slot = slot;
  return slot;
}

function leave(p) {
  if (p.slot && p.slot.who === p) p.slot.who = null;
  p.slot = null;
  p.typing = false;
  p.leaving = true;
  walk(p, ENTRANCE, () => p.leaving && people.delete(p.key));
}

function place(p, spot) {
  p.x = spot.x;
  p.y = spot.y;
  p.at = spot;
  p.pose = spot.kind === 'seat' ? 'sit' : spot.kind === 'boss' ? 'boss' : 'stand';
}

/** Who reported or works as this agent: known by id, or the person at its desk still waiting for theirs. */
function find(agent, role) {
  if (agent && people.has(agent)) return people.get(agent);
  const waiting = [...people.values()].filter((p) => p.role === role && !p.agent && !p.leaving).sort((a, b) => a.born - b.born)[0];
  if (waiting && agent) {
    people.delete(waiting.key);
    waiting.key = agent;
    waiting.agent = agent;
    people.set(agent, waiting);
  }
  return waiting ?? null;
}

// ─── what each beat does ──────────────────────────────────────────────────────────────────────
const lines = [];
function note(at, text) {
  const t = new Date(at);
  lines.push(`${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}  ${text}`);
  while (lines.length > 4) lines.shift();
}
let confetti = [];
let banner = null;
/** What the view follows when it is closer than the whole office: a person as they walk, or a spot. */
let focus = null;
const follow = (target) => (focus = target);
const RECEPTION = { x: COUNTER.x + COUNTER.w / 2, y: COUNTER.y + 14 };
/** The stage a dispatch past its cap was for, while the gate's call waits on the owner. */
let capRole = null;
function settleCap() {
  capRole = null;
  hush(boss, ['alarm']);
  hush(owner, ['phone']);
}

function onBeat(b) {
  const stage = b.role ? stages.get(b.role) : null;
  if (b.type === 'work') {
    if (!stage) return;
    let p = b.agent ? people.get(b.agent) ?? null : null;
    if (b.message && p) {
      if (!b.instant) say(p, 'mail', 1800);
      return;
    }
    if (!p) {
      const key = b.agent ?? `waiting-${(placeholders += 1)}`;
      p = person(key, b.role, b.agent ?? key);
      p.agent = b.agent;
      people.set(key, p);
    }
    p.work = b.id;
    // The dispatch the gate asked about went out: the phone stops.
    if (capRole === b.role) settleCap();
    p.leaving = false;
    const slot = seatAt(stage, p);
    if (b.instant) {
      place(p, slot);
      p.typing = true;
      return;
    }
    note(b.at, `${b.from ? `${b.from.role} → ` : ''}${b.role}${b.resumed ? ' (resumed)' : ''}`);
    // Whoever handed the work on carries the folder over — red when it comes back — or the orchestrator does.
    const from = b.from?.agent ? people.get(b.from.agent) : null;
    const carrier = from && from !== p && !from.leaving ? from : boss;
    const folder = b.from?.back ? C.red : C.paper;
    act(carrier, () => {
      carrier.carrying = folder;
      follow(carrier);
    });
    walk(carrier, stage.drop, () => {
      carrier.carrying = null;
      stage.folder = { color: folder, until: performance.now() + 8000 };
      if (focus === carrier) follow(stage.drop);
    });
    wait(carrier, 300);
    const home = homeOf(carrier);
    if (home) walk(carrier, home, () => place(carrier, home));
    else leave(carrier);
    if (p.x !== slot.x || p.y !== slot.y) walk(p, slot);
    act(p, () => {
      place(p, slot);
      p.typing = true;
    });
    return;
  }
  if (b.type === 'verdict') {
    let p = find(b.agent, b.role);
    if (!p && stage) {
      p = person(b.agent, b.role, b.agent);
      p.agent = b.agent;
      people.set(b.agent, p);
      place(p, seatAt(stage, p));
    }
    if (!p) return;
    const finish = () => {
      p.typing = false;
      if (b.asks) say(p, 'ask');
      else if (!b.instant) say(p, b.back ? 'back' : 'pass', 3000);
      // Someone standing beside a full desk goes once their report is in.
      if (p.slot?.extra) {
        wait(p, b.instant ? 0 : 2500);
        act(p, () => leave(p));
      }
    };
    if (b.instant) finish();
    else {
      act(p, finish);
      follow(p);
    }
    if (!b.instant) note(b.at, `${b.role} ${b.verdict}${b.issues.length ? ` · ${b.issues.slice(0, 3).join(', ')}${b.issues.length > 3 ? '…' : ''}` : ''}${b.asks ? ' — asks you' : ''}`);
    return;
  }
  if (b.type === 'party') {
    if (b.instant) return;
    note(b.at, `${b.role} ${b.verdict} — done`);
    banner = { text: `${b.role} ${b.verdict}`, until: performance.now() + 3500 };
    const now = performance.now();
    confetti = Array.from({ length: 140 }, (_, i) => ({ x: Math.random() * LW, y: -Math.random() * 60, vx: (Math.random() - 0.5) * 30, vy: 25 + Math.random() * 45, color: CONFETTI[i % CONFETTI.length], until: now + 4500 }));
    for (const p of [...people.values(), boss, owner]) p.cheerUntil = now + 3000;
    return;
  }
  if (b.type === 'question') {
    say(boss, 'ask');
    if (!b.instant) {
      note(b.at, `NINA asks ${ROOM.owner}`);
      follow(RECEPTION);
    }
    return;
  }
  if (b.type === 'answered') {
    // The owner's answer answers every question waiting on them, a stage's sent to them included.
    for (const p of [boss, ...people.values()]) hush(p, ['ask']);
    if (!b.instant) {
      say(owner, 'talk', 1500);
      note(b.at, `${ROOM.owner} answered`);
      follow(RECEPTION);
    }
    return;
  }
  if (b.type === 'cap') {
    capRole = b.role;
    say(boss, 'alarm');
    say(owner, 'phone');
    if (!b.instant) {
      note(b.at, `gate: ${b.source} → ${b.role} would go past its cap — asking ${ROOM.owner}`);
      follow(RECEPTION);
    }
    return;
  }
  if (b.type === 'refused' || b.type === 'stale') {
    // A dispatch the owner refused never ran; a run that never reported has stopped. Either way, whoever sat down
    // for it gets up — and a refusal answers the gate's call.
    const p = [...people.values()].find((x) => x.work === b.work);
    if (p && (!p.agent || b.type === 'stale')) leave(p);
    if (b.type === 'refused' && capRole === b.role) settleCap();
    if (!b.instant) note(b.at, b.type === 'refused' ? `${b.role}: not sent — ${ROOM.owner} said no` : `${b.role} stopped without a report`);
    return;
  }
  if (b.type === 'owner') {
    for (const p of people.values()) hush(p, ['ask']);
    capRole = null;
    hush(boss);
    hush(owner);
    if (!b.instant) {
      say(owner, 'talk', 2000);
      note(b.at, `${ROOM.owner} spoke`);
      follow(RECEPTION);
    }
  }
}

function reset() {
  people.clear();
  for (const stage of stages.values()) {
    stage.folder = null;
    for (const sl of stage.slots) sl.who = null;
  }
  for (const p of [boss, owner]) {
    p.queue = [];
    p.current = null;
    p.bubble = null;
    p.carrying = null;
    place(p, p.home);
  }
  owner.facing = 'up';
  lines.length = 0;
  confetti = [];
  banner = null;
  capRole = null;
  focus = null;
}

// ─── the stream ───────────────────────────────────────────────────────────────────────────────
let status = 'connecting…';
let session = null;
const events = new EventSource('events');
events.addEventListener('hello', (m) => {
  const hello = JSON.parse(m.data);
  reset();
  session = hello.session;
  status = hello.session ? (hello.replay ? 'replay' : 'live') : 'waiting for the first dispatch';
});
events.addEventListener('beat', (m) => onBeat(JSON.parse(m.data)));
events.addEventListener('end', () => (status = 'replay finished — reload to watch it again'));
events.onerror = () => {
  if (!status.startsWith('replay finished')) status = 'reconnecting…';
};

// ─── each frame ───────────────────────────────────────────────────────────────────────────────
function step(p, dt) {
  if (!p.current && p.queue.length > 0) {
    p.current = p.queue.shift();
    if (p.current.kind === 'walk') {
      p.path = route(p.at ?? ENTRANCE, p.current.to);
      p.pose = 'walk';
      p.typing = false;
    } else if (p.current.kind === 'wait') p.current.left = p.current.ms;
    else {
      p.current.fn();
      p.current = null;
    }
  }
  const c = p.current;
  if (c?.kind === 'walk') {
    let budget = SPEED * dt;
    while (budget > 0 && p.path.length > 0) {
      const t = p.path[0];
      const dx = t.x - p.x;
      const dy = t.y - p.y;
      const d = Math.hypot(dx, dy);
      if (Math.abs(dy) > Math.abs(dx)) p.facing = dy < 0 ? 'up' : 'down';
      else if (dx !== 0) p.facing = dx < 0 ? 'left' : 'right';
      if (d <= budget) {
        p.x = t.x;
        p.y = t.y;
        budget -= d;
        p.path.shift();
      } else {
        p.x += (dx / d) * budget;
        p.y += (dy / d) * budget;
        budget = 0;
      }
    }
    if (p.path.length === 0) {
      p.at = c.to;
      p.pose = c.to.kind === 'boss' ? 'boss' : 'stand';
      p.facing = p === owner ? 'up' : 'down';
      p.current = null;
      c.then?.();
    }
  } else if (c?.kind === 'wait') {
    c.left -= dt * 1000;
    if (c.left <= 0) p.current = null;
  }
  if (p.bubble && p.bubble.until < performance.now()) p.bubble = null;
}

const world = document.createElement('canvas');
world.width = LW;
world.height = LH;
const w = world.getContext('2d');
const screen = document.getElementById('screen');
const s = screen.getContext('2d');
// Drawn at a scale that is not a whole number, the office is first blown up by the next whole number and then shrunk
// smoothly, so every pixel comes out the same size instead of alternating between two.
const crisp = document.createElement('canvas');
const cg = crisp.getContext('2d');

// ─── the view ─────────────────────────────────────────────────────────────────────────────────
// Sizes are in office pixels; `scale` is screen pixels for each. Fitted whole into a window beside the conversation
// the office drew a person under twenty screen pixels tall, so the view starts at READABLE screen points an office
// pixel — the whole office when that is nearly what fits — and follows the work; the viewer's own zoom is kept. The
// title and the zoom keep a band of their own above the office, so neither covers a room's name.
const READABLE = 2.5;
const CLOSEST = 8;
const BAND = 48;
const HANDS_OFF_MS = 12000;
const ZOOM_KEY = 'nina-office-zoom';
let dpr = 1;
let fit = 1;
let scale = 1;
let band = 0;
let ox = 0;
let oy = 0;
const cam = { x: LW / 2, y: LH / 2 };
let handsOffUntil = 0;
/** 'fit', a zoom the viewer chose in points an office pixel, or null when they never chose. */
let chosen = null;
try {
  const kept = localStorage.getItem(ZOOM_KEY);
  chosen = kept === 'fit' ? 'fit' : Number(kept) > 0 ? Number(kept) : null;
} catch {
  // A page without storage starts at the readable zoom every time.
}
function level() {
  const whole = fit / dpr;
  if (chosen === 'fit' || (chosen === null && whole >= READABLE * 0.85)) return whole;
  return Math.max(whole, Math.min(CLOSEST, chosen ?? READABLE));
}
/** The middle of the part of the screen the office is drawn in. */
const middle = () => [screen.width / 2, band + (screen.height - band) / 2];
const ui = (points) => Math.round(points * dpr);

function syncButtons() {
  document.getElementById('zoom-fit').setAttribute('aria-pressed', String(level() <= (fit / dpr) * 1.001));
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  screen.width = Math.floor(window.innerWidth * dpr);
  screen.height = Math.floor(window.innerHeight * dpr);
  screen.style.width = `${window.innerWidth}px`;
  screen.style.height = `${window.innerHeight}px`;
  band = Math.round(BAND * dpr);
  fit = Math.min(screen.width / LW, (screen.height - band) / LH);
  scale = level() * dpr;
  syncButtons();
}
window.addEventListener('resize', resize);
resize();

/** Zooms by a factor, keeping the office pixel under a screen point where it is. */
function zoomBy(factor, sx = middle()[0], sy = middle()[1]) {
  const [mx, my] = middle();
  const wx = cam.x + (sx - mx) / scale;
  const wy = cam.y + (sy - my) / scale;
  const next = Math.min(CLOSEST, level() * factor);
  chosen = next <= (fit / dpr) * 1.001 ? 'fit' : next;
  try {
    localStorage.setItem(ZOOM_KEY, String(chosen));
  } catch {
    // Kept for this page only.
  }
  scale = level() * dpr;
  cam.x = wx - (sx - mx) / scale;
  cam.y = wy - (sy - my) / scale;
  syncButtons();
}
const handsOn = () => (handsOffUntil = performance.now() + HANDS_OFF_MS);

document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1.25));
document.getElementById('zoom-out').addEventListener('click', () => zoomBy(0.8));
document.getElementById('zoom-fit').addEventListener('click', () => zoomBy(0));
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '+' || e.key === '=') zoomBy(1.25);
  else if (e.key === '-' || e.key === '_') zoomBy(0.8);
  else if (e.key === '0') zoomBy(0);
});
let drag = null;
screen.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
  screen.setPointerCapture(e.pointerId);
  screen.classList.add('dragging');
});
screen.addEventListener('pointermove', (e) => {
  if (!drag) return;
  // A release the page never heard of — over a menu, outside the window — ends the drag at the next move.
  if (e.buttons === 0) {
    dropDrag();
    return;
  }
  cam.x = drag.cx - ((e.clientX - drag.x) * dpr) / scale;
  cam.y = drag.cy - ((e.clientY - drag.y) * dpr) / scale;

const dropDrag = () => {

};
screen.addEventListener('pointerup', dropDrag);
screen.addEventListener('pointercancel', dropDrag);
// A double click hands the view back to the work.
screen.addEventListener('dblclick', () => (handsOffUntil = 0));
screen.addEventListener(
  'wheel',
  (e) => {
    e.preventDefault();
    // A pinch on a trackpad arrives as the wheel with Ctrl held; two fingers alone move the view.
    if (e.ctrlKey || e.metaKey) zoomBy(Math.exp(-e.deltaY * 0.01), e.clientX * dpr, e.clientY * dpr);
    else {
      cam.x += (e.deltaX * dpr) / scale;
      cam.y += (e.deltaY * dpr) / scale;

  { passive: false },

/** Eases the view toward what it follows, unless the viewer moved it lately, and keeps the office on screen. */
function aim(dt, now) {
  scale = level() * dpr;
  const viewW = screen.width / scale;
  const viewH = (screen.height - band) / scale;
  if (focus && now > handsOffUntil) {
    const ease = Math.min(1, dt * 2.5);
    cam.x += (focus.x - cam.x) * ease;
    cam.y += (focus.y - 8 - cam.y) * ease;
  }
  cam.x = viewW >= LW ? LW / 2 : Math.min(LW - viewW / 2, Math.max(viewW / 2, cam.x));
  cam.y = viewH >= LH ? LH / 2 : Math.min(LH - viewH / 2, Math.max(viewH / 2, cam.y));
  const [mx, my] = middle();
  ox = Math.round(mx - cam.x * scale);
  oy = Math.round(my - cam.y * scale);
}

function drawPerson(p, now) {
  const hop = p.cheerUntil > now ? Math.round(Math.abs(Math.sin(now / 110)) * 3) : 0;
  if (p.pose === 'sit') {
    const rows = p.typing && Math.floor(now / 170) % 2 ? SPRITE.sitB : SPRITE.sitA;
    paint(w, rows, p.x - 5, p.y - 14 - hop, p.colors);
    return;
  }
  if (p.pose === 'boss') {
    paint(w, SPRITE.front.slice(0, 10), p.x - 5, p.y - 14 - hop, p.colors);
    return;
  }
  const stepping = p.pose === 'walk' && Math.floor(now / 150) % 2;
  const up = p.facing === 'up';
  let rows = up ? SPRITE.back : SPRITE.front;
  if (p.pose === 'walk') rows = up ? (stepping ? SPRITE.backA : SPRITE.backB) : stepping ? SPRITE.frontA : SPRITE.frontB;
  if (p.cheerUntil > now) rows = SPRITE.cheer;
  rect(w, p.x - 4, p.y, 8, 1, 'rgba(0,0,0,0.22)');
  paint(w, rows, p.x - 5, p.y - 14 - hop, p.colors, p.facing === 'left');
  if (p.carrying) box(w, p.x + 3, p.y - 8 - hop, 5, 4, p.carrying);
}

function drawBubble(p) {
  if (!p.bubble) return;
  // Seated, beside the head: above it, the bubble would cover the desk's nameplate.
  if (p.pose === 'sit') paint(w, BUBBLE[p.bubble.kind], p.x + 5, p.y - 24, BUBBLE_COLORS);
  else paint(w, BUBBLE[p.bubble.kind], p.x - 4, p.y - 27, BUBBLE_COLORS);
}

function drawWorld(now) {
  w.drawImage(background, 0, 0);
  for (const stage of stages.values()) {
    stage.slots.forEach((sl, i) => {
      const d = stage.desks[i];
      const busy = sl.who?.typing;
      rect(w, d.dx + 12, d.dy + 1, 12, 7, busy ? C.screen : C.screenOff);
      if (busy) for (let k = 0; k < 3; k += 1) rect(w, d.dx + 13, d.dy + 2 + k * 2, 3 + ((Math.floor(now / 200) + k * 3) % 8), 1, C.code);
    });
    if (stage.folder && stage.folder.until > now) box(w, stage.desks[0].dx + 2, stage.desks[0].dy + 11, 7, 5, stage.folder.color);
  }
  // The clock in each room says the time it is here.
  const t = new Date();
  for (const room of rooms.values()) {
    if (room.key === 'design' || room.key === 'lab') continue;
    const cx = wallSpot(room) + 5;
    const cy = room.y + 10;
    for (const [len, turn] of [[2, (t.getHours() % 12) / 12 + t.getMinutes() / 720], [3, t.getMinutes() / 60]]) {
      for (let i = 0; i <= len; i += 1) rect(w, cx + Math.round(Math.sin(turn * Math.PI * 2) * i), cy - Math.round(Math.cos(turn * Math.PI * 2) * i), 1, 1, C.ink);
    }
  }
  // The orchestrator stands behind the counter, which is drawn over them; everyone else by how far down they stand.
  if (boss.pose === 'boss') drawPerson(boss, now);
  box(w, COUNTER.x, COUNTER.y - 6, COUNTER.w, 8, C.counter);
  box(w, COUNTER.x, COUNTER.y + 1, COUNTER.w, 10, C.woodMid);
  rect(w, COUNTER.x + 1, COUNTER.y + 10, COUNTER.w - 2, 1, C.woodDark);
  box(w, COUNTER.x + 20, COUNTER.y - 14, 14, 9, C.frame);
  rect(w, COUNTER.x + 21, COUNTER.y - 13, 12, 6, boss.pose === 'boss' ? C.screen : C.screenOff);
  box(w, COUNTER.x + 70, COUNTER.y - 12, 12, 7, C.frame);
  const crowd = [...people.values(), owner, ...(boss.pose === 'boss' ? [] : [boss])].sort((a, b) => a.y - b.y);
  for (const p of crowd) drawPerson(p, now);
  for (const p of [...crowd, ...(boss.pose === 'boss' ? [boss] : [])]) drawBubble(p);
  confetti = confetti.filter((c) => c.until > now && c.y < LH);
  for (const c of confetti) rect(w, c.x, c.y, 2, 1, c.color);
}

const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
const SANS = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif';

/** Writes a line, shrinking it until it fits `max`, and returns how wide it came out. */
function text(str, x, y, size, color, align = 'left', max = Infinity, weight = '', family = MONO) {
  let px = size;
  const font = () => `${weight}${weight ? ' ' : ''}${px}px ${family}`;
  s.font = font();
  while (px > ui(7) && s.measureText(str).width > max) {
    px -= 1;
    s.font = font();
  }
  s.textAlign = align;
  s.textBaseline = 'middle';
  s.fillStyle = color;
  s.fillText(str, x, y);
  return s.measureText(str).width;
}

function panel(x, y, width, height, fill = 'rgba(27,29,38,0.84)') {
  s.fillStyle = fill;
  s.beginPath();
  if (s.roundRect) s.roundRect(x, y, width, height, ui(3));
  else s.rect(x, y, width, height);
  s.fill();
}

/** A name on a dark plate, centred on a screen point, never wider than `max`. */
function plate(str, cx, cy, size, color, max) {
  let px = size;
  s.font = `600 ${px}px ${SANS}`;
  while (px > ui(7) && s.measureText(str).width > max - ui(8)) {
    px -= 1;
    s.font = `600 ${px}px ${SANS}`;
  }
  const width = s.measureText(str).width + ui(8);
  const height = px + ui(6);
  panel(cx - width / 2, cy - height / 2, width, height, 'rgba(34,32,43,0.9)');
  text(str, cx, cy + ui(0.5), px, color, 'center', Infinity, '600', SANS);
}

function drawScreen(now) {
  s.imageSmoothingEnabled = false;
  s.fillStyle = '#1b1d26';
  s.fillRect(0, 0, screen.width, screen.height);
  if (Number.isInteger(scale) || scale > 4) s.drawImage(world, ox, oy, LW * scale, LH * scale);
  else {
    const k = Math.max(1, Math.ceil(scale));
    if (crisp.width !== LW * k) {
      crisp.width = LW * k;
      crisp.height = LH * k;
    }
    cg.imageSmoothingEnabled = false;
    cg.drawImage(world, 0, 0, LW * k, LH * k);
    s.imageSmoothingEnabled = true;
    s.imageSmoothingQuality = 'high';
    s.drawImage(crisp, ox, oy, LW * scale, LH * scale);
    s.imageSmoothingEnabled = false;
  }
  // Names in the office, at the screen's resolution and never smaller than can be read.
  const at = (x, y) => [ox + x * scale, oy + y * scale];
  const label = Math.max(ui(11), Math.round(scale * 3.4));
  for (const room of rooms.values()) {
    const [x, y] = at(room.x + 12, room.y + 8.5);
    text(room.name, x, y, label, C.signText, 'left', (signWidth(room) - 7) * scale, '600', SANS);
  }
  for (const stage of stages.values()) {
    for (const d of stage.desks) {
      const [x, y] = at(d.dx + 18, d.dy + 21.5);
      plate(stage.role, x, y, label, '#fff8e8', (DESK_STEP - 4) * scale);
    }
  }
  {
    const [x, y] = at(COUNTER.x + COUNTER.w / 2, COUNTER.y + 6);
    plate('NINA', x, y, label, C.signText, (COUNTER.w - 8) * scale);
    const [ownerX, ownerY] = at(owner.x + 7, owner.y - 5);
    s.font = `700 ${label}px ${SANS}`;
    const width = Math.min(s.measureText(ROOM.owner).width, 80 * scale);
    plate(ROOM.owner, ownerX + width / 2 + ui(4), ownerY, label, '#ffd34d', 80 * scale + ui(8));
  }
  // What stays put on the screen: the title, the zoom (in the page), the log, a pass worth a party.
  const size = ui(12);
  {
    const title = `NINA office · ${ROOM.project}${session ? ` · ${session.slice(0, 8)}` : ''} · ${status}`;
    s.font = `${size}px ${MONO}`;
    s.fillStyle = '#1b1d26';
    s.fillRect(0, 0, screen.width, band);
    const width = Math.min(s.measureText(title).width + ui(16), screen.width - ui(150));
    panel(ui(10), ui(9), width, ui(30));
    text(title, ui(18), ui(24), size, '#e6e8ee', 'left', width - ui(16));
  }
  if (lines.length > 0) {
    const lineH = ui(19);
    const top = screen.height - lines.length * lineH - ui(12);
    s.fillStyle = 'rgba(27,29,38,0.84)';
    s.fillRect(0, top, screen.width, screen.height - top);
    lines.forEach((l, i) => text(l, ui(14), top + ui(6) + lineH * (i + 0.5), size, '#fff8e8', 'left', screen.width - ui(28)));
  }
  if (banner && banner.until > now) {
    const big = ui(Math.max(20, Math.min(40, window.innerWidth / 22)));
    const width = Math.min(screen.width * 0.86, big * 16);
    panel(screen.width / 2 - width / 2, screen.height / 2 - big, width, big * 2, 'rgba(27,29,38,0.78)');
    text(`✓ ${banner.text}`, screen.width / 2, screen.height / 2, big, '#3ec74d', 'center', width - big, 'bold');
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  for (const p of [...people.values(), boss, owner]) step(p, dt);
  for (const c of confetti) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.vy += 30 * dt;
  }
  aim(dt, now);
  drawWorld(now);
  drawScreen(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
